<script type="importmap">
{
  "imports": {
    "config/": "./config/",
    "core/": "./src/core/",
    "art/": "./src/art/",
    "game/": "./src/game/",
    "ui/": "./src/ui/"
  }
}
</script>
</head>
<body>
<div id="stage">
  <div id="game-root" role="application" aria-label="Dual Fist Arena battle stage"></div>
  <div id="hint-layer" class="hint-layer" aria-live="polite" role="status"></div>
  <div id="ui-root"></div>
</div>

<div id="boot" class="boot">
  <div class="boot__inner">
    <div class="boot__mark">pipygames<span>.com</span></div>
    <div class="boot__ring" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="boot__bar"><em id="boot-fill"></em></div>
    <div class="boot__row">
      <span class="boot__tip" id="boot-tip">Loading…</span>
      <span class="boot__pct" id="boot-pct" aria-live="polite">0%</span>
    </div>
  </div>
</div>
<script>
  /* 开屏自检：ES Module 的静态依赖在 link 阶段就失败了，任何 try/catch 都拦不到，
     浏览器只会往控制台丢一句 "does not provide an export named ..."，
     页面停在 Loading 上一直转圈。这里把错误直接画到开屏页上，并加超时看门狗。 */
  (function () {
    var shown = false;
    function paint(msg) {
      if (shown) return;
      shown = true;
      var boot = document.getElementById("boot");
      var tip = document.getElementById("boot-tip");
      if (tip) tip.textContent = msg;
      if (boot) boot.classList.add("is-fail");
      console.error("[boot]", msg);
    }
    window.__pipyBootFail = paint;
    window.addEventListener("error", function (e) {
      var t = e.target;
      if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
        paint("Failed to load " + (t.src || t.href).split("/").pop());
      } else {
        paint(e.message || "Unknown error");
      }
    }, true);
    window.addEventListener("unhandledrejection", function (e) {
      var r = e.reason;
      paint((r && (r.message || String(r))) || "Module failed to load");
    });
    setTimeout(function () {
      if (!window.__pipyBootOk) {
        paint("Load timed out.\nPress Ctrl+Shift+R to hard-reload, or reopen with 一键启动.bat");
      }
    }, 10000);
  })();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
